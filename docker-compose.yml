name: arnotes

services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://arnotes:arnotes@postgres:5432/arnotes}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      ALLOW_SIGN_UP: ${ALLOW_SIGN_UP:-true}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      NUXT_PUBLIC_ALLOW_SIGN_UP: ${ALLOW_SIGN_UP:-true}
      NUXT_PUBLIC_DISCORD_ENABLED: ${NUXT_PUBLIC_DISCORD_ENABLED:-false}
      NUXT_PUBLIC_GITHUB_ENABLED: ${NUXT_PUBLIC_GITHUB_ENABLED:-false}
      NUXT_PUBLIC_EMBEDDINGS_ENABLED: ${NUXT_PUBLIC_EMBEDDINGS_ENABLED:-true}
      EMBEDDING_CACHE_DIR: /app/data/models
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app_data:/app/data
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db-setup:
    build:
      context: .
      target: database
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://arnotes:arnotes@postgres:5432/arnotes}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arnotes
      POSTGRES_USER: arnotes
      POSTGRES_PASSWORD: arnotes
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arnotes -d arnotes"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
